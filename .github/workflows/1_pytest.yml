# ============================================================
# Завдання 1: Автоматичне тестування з Pytest
# ============================================================
# Запускає pytest при кожному push / pull_request
# і публікує результати тестування як артефакт.

name: "1 — Pytest Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
      # 1. Отримати код репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Встановити Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Встановити залежності
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запустити тести
      - name: Run tests with Pytest
        run: |
          python -m pytest tests/ -v --tb=short

      # 5. Зберегти результати як артефакт
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: tests/
